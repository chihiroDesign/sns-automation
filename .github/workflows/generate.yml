name: Generate Weekly SNS Content

on:
  schedule:
    # Every Monday at 09:00 JST (= 00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  generate:
    name: Generate 2-Week Content
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install anthropic gspread google-auth

      - name: Run content generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/generate_content.py
